[project]
name = "argus"
version = "0.1.0"
requires-python = ">=3.12"
# 🔴 pydantic 은 src/argus/api/server.py:7 이, numpy 는 src/argus/retrieve/bm25.py:26
# 과 src/argus/embed.py:20 이 직접 import 한다. 앞의 것은 fastapi 가, 뒤의 것은
# rank-bm25 가 끌어오므로 선언 없이도 동작해 왔지만, 그것은 우연이다 — 그 둘이 의존을
# 바꾸면 조용히 깨진다. 직접 쓰는 것은 직접 선언한다.
dependencies = [
    "fastapi>=0.115", "uvicorn>=0.32", "rank-bm25>=0.2.2", "pydantic>=2.9",
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# "." 은 tests/test_eval_e2e.py 의 `from scripts.eval_e2e import ...` 용이다.
# `python -m pytest` 는 cwd 를 sys.path 에 넣어 주지만 `pytest` 는 넣지 않는다.
pythonpath = ["src", "."]
testpaths = ["tests"]
